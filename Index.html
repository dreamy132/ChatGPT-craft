<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Minecraft</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; background:#87ceeb; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const blockSize = 40;
const worldWidth = 20;
const worldHeight = 15;

// Simple world array: 0 = air, 1 = ground
let world = Array.from({length: worldHeight}, (_, y) => 
  Array.from({length: worldWidth}, (_, x) => y > 10 ? 1 : 0)
);

let player = {x:5, y:9};
let bot = {x:2, y:9};

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // Draw world
  for(let y=0;y<worldHeight;y++){
    for(let x=0;x<worldWidth;x++){
      if(world[y][x]===1){
        ctx.fillStyle='saddlebrown';
        ctx.fillRect(x*blockSize, y*blockSize, blockSize, blockSize);
      }
    }
  }
  
  // Draw player
  ctx.fillStyle='blue';
  ctx.fillRect(player.x*blockSize, player.y*blockSize, blockSize, blockSize);
  
  // Draw bot
  ctx.fillStyle='green';
  ctx.fillRect(bot.x*blockSize, bot.y*blockSize, blockSize, blockSize);
}

function moveBot() {
  if(bot.x < player.x) bot.x++;
  else if(bot.x > player.x) bot.x--;
  if(bot.y < player.y) bot.y++;
  else if(bot.y > player.y) bot.y--;
}

function gameLoop(){
  moveBot();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();

// Player controls
window.addEventListener('keydown', e => {
  if(e.key==='ArrowUp' && player.y>0) player.y--;
  if(e.key==='ArrowDown' && player.y<worldHeight-1) player.y++;
  if(e.key==='ArrowLeft' && player.x>0) player.x--;
  if(e.key==='ArrowRight' && player.x<worldWidth-1) player.x++;
});
</script>
</body>
</html>
