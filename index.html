<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Minecraft Smart Bot</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; background:#87ceeb; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const blockSize = 40;
const worldWidth = 20;
const worldHeight = 15;

// World: 0 = air, 1 = ground
let world = Array.from({length: worldHeight}, (_, y) => 
  Array.from({length: worldWidth}, (_, x) => y > 10 ? 1 : 0)
);

let player = {x:5, y:9};
let bot = {x:2, y:9, mode:'follow', inventory:0};

// Draw world, player, bot
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<worldHeight;y++){
    for(let x=0;x<worldWidth;x++){
      if(world[y][x]===1){
        ctx.fillStyle='saddlebrown';
        ctx.fillRect(x*blockSize, y*blockSize, blockSize, blockSize);
      }
    }
  }
  ctx.fillStyle='blue'; ctx.fillRect(player.x*blockSize, player.y*blockSize, blockSize, blockSize);
  ctx.fillStyle='green'; ctx.fillRect(bot.x*blockSize, bot.y*blockSize, blockSize, blockSize);

  // Draw inventory
  ctx.fillStyle='black';
  ctx.fillText('Bot inventory: '+bot.inventory, 10, 20);
}

// Bot logic: follow + build/mine intelligently
function botAction() {
  // FOLLOW MODE
  if(bot.mode==='follow'){
    if(bot.x < player.x) bot.x++;
    else if(bot.x > player.x) bot.x--;
    if(bot.y < player.y) bot.y++;
    else if(bot.y > player.y) bot.y--;
  }

  // BUILD MODE: place a wall next to bot if air
  if(bot.mode==='build'){
    let targetX = bot.x + 1;
    let targetY = bot.y;
    if(targetX < worldWidth && world[targetY][targetX]===0){
      world[targetY][targetX] = 1;
      if(bot.inventory>0) bot.inventory--;
    }
  }

  // MINE MODE: mine block in front of bot
  if(bot.mode==='mine'){
    let targetX = bot.x + 1;
    let targetY = bot.y;
    if(targetX < worldWidth && world[targetY][targetX]===1){
      world[targetY][targetX] = 0;
      bot.inventory++;
    }
  }
}

function gameLoop(){
  botAction();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();

// Player controls
window.addEventListener('keydown', e => {
  if(e.key==='ArrowUp' && player.y>0) player.y--;
  if(e.key==='ArrowDown' && player.y<worldHeight-1) player.y++;
  if(e.key==='ArrowLeft' && player.x>0) player.x--;
  if(e.key==='ArrowRight' && player.x<worldWidth-1) player.x++;

  // Switch bot modes
  if(e.key==='1') bot.mode='follow';
  if(e.key==='2') bot.mode='build';
  if(e.key==='3') bot.mode='mine';
});
</script>
</body>
</html>
